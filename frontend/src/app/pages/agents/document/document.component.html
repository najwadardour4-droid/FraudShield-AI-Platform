<div class="page-header">
  <h1>DOCUMENT VERIFIER</h1>
  <p>CNN // OCR // IMAGE FORENSICS ACTIVE</p>
</div>

<div class="agent-layout">
  <div class="panel form-panel">
    <div class="panel-header-mini">UPLOAD DOCUMENT</div>
    <label class="drop-zone">
      <input type="file" (change)="onFile($event)" accept="image/*" hidden />
      <div class="upload-icon">📤</div>
      <span>SELECT IMAGE OR DROP HERE</span>
      <small>PNG, JPG — INVOICES, ID CARDS, RECEIPTS</small>
    </label>
    @if (imagePreview()) {
      <div class="doc-preview-container">
        <img [src]="imagePreview()!" class="doc-image" />
        <div class="bounding-box" [class.fake]="result()?.verdict === 'FAKE'">
          <div class="scan-line-horizontal"></div>
          <span class="box-label">SCANNING AREA: DETECTED</span>
        </div>
      </div>
    }
    @if (loading()) { <p class="muted">ANALYZING DOCUMENT...</p> }
    @if (error()) { <p class="error">{{ error() }}</p> }
  </div>

  <div class="panel result-panel">
    <div class="panel-header-mini">SCAN ANALYSIS</div>
    @if (result()) {
      <app-prediction-result [result]="result()!" />
    } @else {
      <div class="empty-state">
        <div class="scan-line"></div>
        <p class="muted">AWAITING DOCUMENT UPLOAD...</p>
      </div>
    }
  </div>
</div>
