<div class="w-32 border-r-2 border-cyan-400/30 bg-[#0A0A0A] flex flex-col h-screen">

  <!-- HEADER -->
  <div class="p-4 border-b-2 border-cyan-400/30">

    <div class="text-xs text-cyan-400/60 text-center tracking-wider mb-2">
      MODE
    </div>

    <div class="text-center text-cyan-400 text-xs font-bold">
      SELECT
    </div>

  </div>

  <!-- MENU -->
  <div class="flex-1 py-6 space-y-4">

    <!-- IMAGE -->
    <button
      (click)="changeMode('image')"
      class="relative w-full p-4 transition-all duration-300"
      [ngClass]="currentMode === 'image'
      ? 'bg-[#020617]'
      : 'hover:bg-[#111827]'">

      <div class="flex flex-col items-center gap-3">

        <div
          class="relative p-4 border-2"
          [ngClass]="currentMode === 'image'
          ? 'border-cyan-400 shadow-[0_0_20px_#00F2FF80]'
          : 'border-cyan-400/20'">

          <span class="text-2xl"
            [ngClass]="currentMode === 'image'
            ? 'text-cyan-400'
            : 'text-cyan-400/40'">
            🖼️
          </span>

        </div>

        <span
          class="text-xs font-bold tracking-widest text-center"
          [ngClass]="currentMode === 'image'
          ? 'text-cyan-400'
          : 'text-cyan-400/40'">

          IMAGE SCAN

        </span>

      </div>

    </button>

    <!-- VIDEO -->
    <button
      (click)="changeMode('video')"
      class="relative w-full p-4 transition-all duration-300"
      [ngClass]="currentMode === 'video'
      ? 'bg-[#020617]'
      : 'hover:bg-[#111827]'">

      <div class="flex flex-col items-center gap-3">

        <div
          class="relative p-4 border-2"
          [ngClass]="currentMode === 'video'
          ? 'border-cyan-400 shadow-[0_0_20px_#00F2FF80]'
          : 'border-cyan-400/20'">

          <span class="text-2xl"
            [ngClass]="currentMode === 'video'
            ? 'text-cyan-400'
            : 'text-cyan-400/40'">
            🎥
          </span>

        </div>

        <span
          class="text-xs font-bold tracking-widest text-center"
          [ngClass]="currentMode === 'video'
          ? 'text-cyan-400'
          : 'text-cyan-400/40'">

          VIDEO SCAN

        </span>

      </div>

    </button>

    <!-- AUDIO -->
    <button
      (click)="changeMode('audio')"
      class="relative w-full p-4 transition-all duration-300"
      [ngClass]="currentMode === 'audio'
      ? 'bg-[#020617]'
      : 'hover:bg-[#111827]'">

      <div class="flex flex-col items-center gap-3">

        <div
          class="relative p-4 border-2"
          [ngClass]="currentMode === 'audio'
          ? 'border-cyan-400 shadow-[0_0_20px_#00F2FF80]'
          : 'border-cyan-400/20'">

          <span class="text-2xl"
            [ngClass]="currentMode === 'audio'
            ? 'text-cyan-400'
            : 'text-cyan-400/40'">
            🎧
          </span>

        </div>

        <span
          class="text-xs font-bold tracking-widest text-center"
          [ngClass]="currentMode === 'audio'
          ? 'text-cyan-400'
          : 'text-cyan-400/40'">

          AUDIO ANALYSIS

        </span>

      </div>

    </button>

    <!-- LIVE CALL -->
    <button
      (click)="changeMode('live-call')"
      class="relative w-full p-4 transition-all duration-300"
      [ngClass]="currentMode === 'live-call'
      ? 'bg-[#020617]'
      : 'hover:bg-[#111827]'">

      <div class="flex flex-col items-center gap-3">

        <div
          class="relative p-4 border-2"
          [ngClass]="currentMode === 'live-call'
          ? 'border-cyan-400 shadow-[0_0_20px_#00F2FF80]'
          : 'border-cyan-400/20'">

          <span class="text-2xl"
            [ngClass]="currentMode === 'live-call'
            ? 'text-cyan-400'
            : 'text-cyan-400/40'">
            📞
          </span>

        </div>

        <span
          class="text-xs font-bold tracking-widest text-center"
          [ngClass]="currentMode === 'live-call'
          ? 'text-cyan-400'
          : 'text-cyan-400/40'">

          LIVE CALL SHIELD

        </span>

      </div>

    </button>

  </div>

  <!-- FOOTER -->
  <div class="p-4 border-t-2 border-cyan-400/30">

    <div class="flex flex-col items-center gap-1">

      <div class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_10px_#00F2FF]"></div>

      <span class="text-xs text-cyan-400/60">
        ACTIVE
      </span>

    </div>

  </div>

</div>
